name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm supabase start
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: local-test-client-id
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: local-test-client-secret
      - run: pnpm test:db
      - if: always()
        run: pnpm supabase stop --no-backup
